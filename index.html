<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>هۆشمەند خەلیفانی</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 14px;
            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(0, 150, 255, 0.22),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(135, 55, 255, 0.22),
                    transparent 32%
                ),
                linear-gradient(
                    135deg,
                    #02030a,
                    #0a0e1b 52%,
                    #03040a
                );
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(85px);
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            width: 330px;
            height: 330px;
            background: rgba(0, 170, 255, 0.10);
            top: -120px;
            left: -100px;
            animation: moveBlue 8s infinite alternate;
        }

        body::after {
            width: 360px;
            height: 360px;
            background: rgba(150, 60, 255, 0.10);
            bottom: -150px;
            right: -120px;
            animation: movePurple 9s infinite alternate;
        }

        @keyframes moveBlue {
            to {
                transform: translate(110px, 80px);
            }
        }

        @keyframes movePurple {
            to {
                transform: translate(-100px, -70px);
            }
        }

        .container {
            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 480px;

            text-align: center;

            padding: 34px 20px 24px;

            border: 1px solid rgba(255, 255, 255, 0.11);
            border-radius: 30px;

            background: rgba(255, 255, 255, 0.045);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.5),
                inset 0 1px rgba(255, 255, 255, 0.08);

            animation: pageOpen 0.8s ease;
        }

        @keyframes pageOpen {
            from {
                opacity: 0;
                transform: translateY(28px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .profile {
            margin-bottom: 29px;
        }

        .profile-picture {
            width: 128px;
            height: 128px;

            object-fit: cover;

            border-radius: 50%;

            padding: 4px;

            background: linear-gradient(
                135deg,
                #ffffff,
                #6c63ff,
                #00c6ff
            );

            box-shadow:
                0 0 25px rgba(80, 130, 255, 0.45),
                0 0 60px rgba(100, 60, 255, 0.18);

            animation: profileGlow 3s infinite alternate;
        }

        @keyframes profileGlow {
            to {
                box-shadow:
                    0 0 38px rgba(90, 140, 255, 0.75),
                    0 0 65px rgba(120, 60, 255, 0.22);
            }
        }

        .name {
            margin-top: 16px;
            font-size: 28px;
            font-weight: bold;
        }

        .welcome {
            margin-top: 8px;
            font-size: 16px;
            line-height: 1.8;
            color: #e8e8e8;
        }

        .description {
            margin-top: 5px;
            color: #858b9b;
            font-size: 13px;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .social-link {
            height: 75px;

            display: flex;
            align-items: center;

            padding: 0 17px;

            text-decoration: none;
            color: white;

            border-radius: 20px;

            border: 1px solid rgba(255, 255, 255, 0.11);

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.09),
                    rgba(255, 255, 255, 0.035)
                );

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.22),
                inset 0 1px rgba(255, 255, 255, 0.06);

            transition: 0.25s ease;

            animation: linkAppear 0.65s backwards;
        }

        .social-link:nth-child(1) {
            animation-delay: 0.12s;
        }

        .social-link:nth-child(2) {
            animation-delay: 0.24s;
        }

        .social-link:nth-child(3) {
            animation-delay: 0.36s;
        }

        @keyframes linkAppear {
            from {
                opacity: 0;
                transform: translateX(28px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .social-link:hover {
            transform: translateY(-4px) scale(1.015);

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.15),
                    rgba(255, 255, 255, 0.06)
                );

            box-shadow:
                0 16px 35px rgba(0, 0, 0, 0.35),
                0 0 20px rgba(100, 130, 255, 0.12);
        }

        .social-logo {
            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: rgba(255, 255, 255, 0.09);

            margin-left: 15px;

            flex-shrink: 0;
        }

        .social-logo svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .social-info {
            flex: 1;
            text-align: right;
        }

        .social-title {
            font-size: 17px;
            font-weight: bold;
        }

        .social-username {
            margin-top: 4px;
            color: #858b9b;
            font-size: 12px;

            direction: ltr;
            text-align: right;
        }

        .arrow {
            font-size: 28px;
            color: #777f91;
            transition: 0.25s;
        }

        .social-link:hover .arrow {
            transform: translateX(-5px);
            color: white;
        }

        .footer {
            margin-top: 27px;
            padding-top: 17px;

            border-top: 1px solid rgba(255, 255, 255, 0.07);

            color: #666d7c;
            font-size: 12px;
        }

        @media (max-width: 450px) {

            .container {
                padding: 29px 16px 22px;
                border-radius: 25px;
            }

            .profile-picture {
                width: 112px;
                height: 112px;
            }

            .name {
                font-size: 24px;
            }

            .welcome {
                font-size: 14px;
            }

            .social-link {
                height: 69px;
            }
        }
    </style>
</head>
